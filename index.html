<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Land2Homestead</title>
<style>
:root{--bg:#f4f7f3;--card:#fff;--ink:#17301f;--muted:#66736a;--line:#dfe7df;--green:#2d6a45;--pale:#e8f2ea;--yellow:#9a711d;--red:#a43b35;--blue:#285b8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:#17301f;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:20}.brand{font-weight:800;font-size:22px}.sub{font-size:12px;opacity:.75}.wrap{max-width:1250px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:225px 1fr;gap:16px}.nav,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.nav{padding:9px;position:sticky;top:76px;height:max-content}.nav button{display:block;width:100%;padding:10px;border:0;background:none;text-align:left;border-radius:9px;color:var(--ink)}.nav button.active,.nav button:hover{background:var(--pale);color:var(--green)}.card{padding:17px;margin-bottom:15px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:center}.h1{font-size:29px;font-weight:800;margin:0 0 4px}.muted{color:var(--muted)}.small{font-size:12px}.stats,.grid4,.grid3,.grid2{display:grid;gap:10px}.stats{grid-template-columns:repeat(4,1fr);margin-top:15px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.stat{background:var(--pale);padding:13px;border-radius:11px}.stat b{display:block;font-size:22px}.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--green);color:#fff;font-weight:700}.btn.secondary{background:#eef2ee;color:var(--ink)}.btn.warn{background:#fff4d8;color:#76530c}.btn.danger{background:#f9e7e5;color:#8b2f2a}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:160px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea,input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.field textarea,textarea{min-height:85px}.pill{display:inline-block;background:#edf2ed;border-radius:999px;padding:5px 8px;font-size:12px;margin:2px}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.blue{color:var(--blue)}.item{padding:11px;border:1px solid var(--line);border-radius:10px;margin:7px 0}.check{display:block;padding:8px 0}.check input{width:auto;margin-right:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.empty{padding:25px;text-align:center;color:var(--muted)}.modalwrap{position:fixed;inset:0;background:#0008;z-index:40;padding:15px;overflow:auto}.modalbox{background:#fff;max-width:950px;margin:20px auto;border-radius:16px;padding:20px}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px;border-radius:9px}.tabs button.active{background:var(--pale);color:var(--green);border-color:#c9ddcc}.notice{padding:11px;border-radius:10px;background:#f4f7f4;border-left:4px solid var(--green)}.dangerbox{background:#fff1ef;border-left-color:var(--red)}@media(max-width:850px){.layout{grid-template-columns:1fr}.nav{position:static;display:flex;overflow:auto;gap:4px}.nav button{min-width:max-content}.stats,.grid4,.grid3,.grid2{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.stats,.grid4,.grid3,.grid2{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><div class="top"><div class="brand">Land2Homestead</div><div class="sub">Land research • due diligence • acquisition workspace</div></div><div class="wrap"><div class="layout"><aside class="nav" id="nav"></aside><main id="app"></main></div></div><div id="modal"></div>
<script>
const NAV=['Dashboard','Saved Properties','Contacts','Pending Offers','Research','Testing','Permits','Pending Approvals','Profile'];
const CHECKS=['Verify address','Verify block & lot','Review deed records','Review taxes/assessment','Confirm zoning','Check Pinelands','Check wetlands/buffer','Check flood zone','Check sewer/water','Check electric/gas','Check septic/perc','Check well records','Review easements/restrictions','Obtain survey','Review permits','Get contractor estimates','Review listing/MLS','Prepare offer','Review contract','Final approval/closing'];
const TEST_TYPES=['Perc','Soil','Water','Well','Environmental','Inspection']; const PERMIT_TYPES=['Building','Zoning','Septic','Well','Driveway','Clearing/Grading','Environmental','Pinelands','Health Department','Electrical','Plumbing'];
let page='Dashboard', selected=null, workspaceTab='Overview';
let db=JSON.parse(localStorage.getItem('l2h_db_v5')||'null')||{properties:[],contacts:[],profile:{first:'',last:'',username:'',email:'',phone:'',type:'Undecided'}};
function save(){localStorage.setItem('l2h_db_v5',JSON.stringify(db))} function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function go(x){page=x;render()}
function renderNav(){nav.innerHTML=NAV.map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('')}
function render(){renderNav();let a=document.getElementById('app');a.innerHTML=page==='Dashboard'?dashboard():page==='Saved Properties'?properties():page==='Contacts'?contacts():page==='Pending Offers'?offers():page==='Research'?research():page==='Testing'?testing():page==='Permits'?permits():page==='Pending Approvals'?approvals():profile();}
function dashboard(){let offers=count('offers',['Pending','Submitted','Countered']), tests=count('tests',['Pending','Scheduled']), perms=count('permits',['Pending','Submitted']), approvals=count('permits',['Pending Approval']);return `<div class="card"><div class="hero"><div><div class="h1">Property Command Center</div><div class="muted">Everything for researching, buying and developing land.</div></div><button class="btn" onclick="openProperty()">+ Add Property</button></div><div class="stats"><div class="stat"><b>${db.properties.length}</b>Saved Properties</div><div class="stat"><b>${db.contacts.length}</b>Contacts</div><div class="stat"><b>${offers}</b>Pending Offers</div><div class="stat"><b>${tests+perms+approvals}</b>Pending Actions</div></div></div><div class="grid2"><div class="card"><h2>Action Center</h2>${actionRows()}</div><div class="card"><h2>Quick Access</h2><div class="toolbar"><button class="btn secondary" onclick="go('Research')">Research</button><button class="btn secondary" onclick="go('Contacts')">Contacts</button><button class="btn secondary" onclick="go('Testing')">Testing</button><button class="btn secondary" onclick="go('Permits')">Permits</button></div></div></div>`}
function count(key,statuses){return db.properties.reduce((n,p)=>n+(p[key]||[]).filter(x=>statuses.includes(x.status)).length,0)}
function actionRows(){let arr=[];db.properties.forEach(p=>{(p.tests||[]).filter(x=>['Pending','Scheduled'].includes(x.status)).forEach(x=>arr.push(`🟡 Testing: ${esc(x.type)} — ${esc(p.address)}`));(p.permits||[]).filter(x=>['Pending','Submitted','Pending Approval'].includes(x.status)).forEach(x=>arr.push(`🟡 Permit: ${esc(x.type)} — ${esc(p.address)}`));(p.offers||[]).filter(x=>['Pending','Submitted','Countered'].includes(x.status)).forEach(x=>arr.push(`🟡 Offer: $${esc(x.amount||'—')} — ${esc(p.address)}`))});return arr.length?arr.slice(0,12).map(x=>`<div class="item">${x}</div>`).join(''):'<p class="muted">No pending actions.</p>'}
function properties(){return `<div class="card"><div class="hero"><div><div class="h1">Saved Properties</div><div class="muted">Each property has its own research, contacts, documents and due-diligence workspace.</div></div><button class="btn" onclick="openProperty()">+ Add Property</button></div></div>${db.properties.length?db.properties.map((p,i)=>`<div class="card"><div class="hero"><div><h3>${esc(p.address)}</h3><div class="muted">${esc(p.city||'')} ${esc(p.state||'NJ')} ${esc(p.zip||'')}</div><div><span class="pill">Block ${esc(p.block||'—')}</span><span class="pill">Lot ${esc(p.lot||'—')}</span><span class="pill">${esc(p.acres||'—')} acres</span><span class="pill">${esc(p.zoning||'Zoning unknown')}</span>${p.price?`<span class="pill">$${esc(p.price)}</span>`:''}</div></div><div class="toolbar"><button class="btn" onclick="openWorkspace(${i})">Open</button><button class="btn danger" onclick="delProp(${i})">Delete</button></div></div></div>`).join(''):'<div class="card empty">No saved properties yet.</div>'}`}
function contacts(){return `<div class="card"><div class="hero"><div><div class="h1">Saved Contacts</div><div class="muted">Reusable people and organizations. Communications can be tied to a property.</div></div><button class="btn" onclick="openContact()">+ Contact</button></div></div>${db.contacts.length?db.contacts.map((c,i)=>`<div class="card"><div class="hero"><div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.role||'')} • ${esc(c.company||'')}</div><p>${c.email?`✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:''} ${c.phone?`📞 <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:''}</p></div><div class="toolbar"><button class="btn secondary" onclick="logComm(${i})">Log Communication</button><button class="btn danger" onclick="db.contacts.splice(${i},1);save();render()">Delete</button></div></div>${(c.comms||[]).slice(-3).reverse().map(m=>`<div class="item"><b>${esc(m.type)}</b> • ${esc(m.date)} • ${esc(m.subject||'')}<br>${esc(m.notes||'')}</div>`).join('')}</div>`).join(''):'<div class="card empty">No saved contacts.</div>'}`}
function offers(){let arr=[];db.properties.forEach((p,pi)=>(p.offers||[]).forEach((o,oi)=>arr.push({p,pi,o,oi})));return `<div class="card"><div class="h1">Pending Offers</div><div class="muted">Track offers, counters, contingencies and responses.</div></div>${arr.length?arr.map(x=>`<div class="card"><h3>${esc(x.p.address)}</h3><div><b>$${esc(x.o.amount||'—')}</b> • <span class="pill">${esc(x.o.status)}</span> • ${esc(x.o.date||'')}</div><p>${esc(x.o.notes||'')}</p></div>`).join(''):'<div class="card empty">No offers recorded.</div>'}`}
function research(){return `<div class="card"><div class="h1">NJ Property Research</div><div class="muted">Search official NJ public parcel/MOD-IV information. The app will only save a parcel when the returned street address/city can be verified against the requested address.</div><div class="toolbar" style="margin-top:12px"><input id="researchAddr" placeholder="e.g. 5 Friendship Rd, Southampton, NJ" style="flex:1;min-width:220px"><button class="btn" onclick="researchNJ()">Research Property</button></div><div id="researchResult"></div></div><div class="grid2"><div class="card"><h3>Public records</h3><p class="muted">Block, lot, qualifier, PIN, county, municipality, acreage, property class, assessed values, prior-year tax, building/land description and other published parcel fields.</p></div><div class="card"><h3>GIS / utilities</h3><p class="muted">NJDEP publishes sewer service areas, electric territories, gas territories and purveyor layers that can be incorporated into property research.</p></div></div>`}
async function researchNJ(){let raw=document.getElementById('researchAddr').value.trim(),out=document.getElementById('researchResult');if(!raw)return;out.innerHTML='<div class="notice">Searching NJ geocoder and public parcel data…</div>';try{let g=await fetch('https://geo.nj.gov/arcgis/rest/services/Tasks/NJ_Geocode/GeocodeServer/findAddressCandidates?SingleLine='+encodeURIComponent(raw+', NJ')+'&f=json&outSR=4326').then(r=>r.json());let c=(g.candidates||[])[0];if(!c){out.innerHTML='<div class="notice dangerbox red">No NJ address match found.</div>';return}let parsed=parseAddress(c.address||raw), q="ST_ADDRESS LIKE '"+parsed.number+' '+parsed.street.replace(/'/g,"''")+"%'";let url='https://maps.nj.gov/arcgis/rest/services/Applications/NJ_TaxListSearch/MapServer/2/query?where='+encodeURIComponent(q)+'&outFields='+encodeURIComponent('PAMS_PIN,PCLBLOCK,PCLLOT,PCLQCODE,COUNTY,MUN_NAME,ST_ADDRESS,CITY_STATE,ZIP_CODE,CALC_ACRE,LAND_VAL,IMPRVT_VAL,NET_VALUE,LAST_YR_TX,BLDG_DESC,LAND_DESC,PROP_CLASS')+'&returnGeometry=true&outSR=4326&f=json';let r=await fetch(url).then(x=>x.json());let fs=r.features||[];let f=fs.find(x=>addressMatches(x.attributes,c.address));if(!f){out.innerHTML=`<div class="notice dangerbox"><b>Parcel could not be verified.</b><br>Geocoder matched <b>${esc(c.address)}</b>, but the parcel service did not return a parcel with a matching street address. Nothing was saved.</div>`;return}let a=f.attributes, geom=f.geometry;let p={address:a.ST_ADDRESS||c.address,city:(a.CITY_STATE||'').split(',')[0],state:'NJ',zip:a.ZIP_CODE||'',block:a.PCLBLOCK,lot:a.PCLLOT,qualifier:a.PCLQCODE,pin:a.PAMS_PIN,county:a.COUNTY,municipality:a.MUN_NAME,acres:a.CALC_ACRE,propClass:a.PROP_CLASS,landVal:a.LAND_VAL,imprVal:a.IMPRVT_VAL,netVal:a.NET_VALUE,tax:a.LAST_YR_TX,bldgDesc:a.BLDG_DESC,landDesc:a.LAND_DESC,lat:c.location?.y,lon:c.location?.x,geometry:geom,offers:[],tests:[],permits:[],communications:[],documents:[],photos:[],estimates:[],contracts:[],approvals:[],checks:[],researchDate:new Date().toISOString()};out.innerHTML=researchCard(p)}catch(e){out.innerHTML='<div class="notice dangerbox red">The public research service could not be reached. Try again in a moment.</div>'}}
function parseAddress(s){let m=s.trim().match(/^(\d+[A-Z]?)\s+(.+)$/i);return {number:m?m[1]:'',street:m?m[2].split(',')[0]:s}} function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')} function addressMatches(a,b){let x=norm(a.ST_ADDRESS),y=norm(b);return x&&y&&(x.includes(norm(y))||norm(y).includes(x))}
function researchCard(p){return `<div class="card" style="margin-top:12px"><div class="hero"><div><h3>${esc(p.address)}</h3><div class="muted">${esc(p.municipality||'')} • ${esc(p.county||'')} County</div></div><button class="btn" onclick='saveResearch(${JSON.stringify(p)})'>Save Property</button></div><div class="grid4" style="margin-top:12px"><div><span class="muted">Block</span><br><b>${esc(p.block||'—')}</b></div><div><span class="muted">Lot</span><br><b>${esc(p.lot||'—')}</b></div><div><span class="muted">Acreage</span><br><b>${esc(p.acres||'—')}</b></div><div><span class="muted">PIN</span><br><b>${esc(p.pin||'—')}</b></div></div><table class="table" style="margin-top:12px"><tr><th>County</th><td>${esc(p.county||'—')}</td><th>Municipality</th><td>${esc(p.municipality||'—')}</td></tr><tr><th>Land value</th><td>${money(p.landVal)}</td><th>Improvement</th><td>${money(p.imprVal)}</td></tr><tr><th>Net assessed</th><td>${money(p.netVal)}</td><th>Prior-year tax</th><td>${money(p.tax)}</td></tr><tr><th>Property class</th><td>${esc(p.propClass||'—')}</td><th>Building</th><td>${esc(p.bldgDesc||'—')}</td></tr><tr><th>Land</th><td>${esc(p.landDesc||'—')}</td><th>Qualifier</th><td>${esc(p.qualifier||'—')}</td></tr></table><p class="small muted">Parcel verification passed using the returned street address. Parcel boundaries and public records should still be independently confirmed before a transaction.</p></div>`}
function money(v){return v==null||v===''?'—':'$'+Number(v).toLocaleString()}
function saveResearch(p){let exists=db.properties.find(x=>x.pin&&x.pin===p.pin);if(exists){Object.assign(exists,p);save();go('Saved Properties');return}db.properties.push(p);save();go('Saved Properties')}
function testing(){return `<div class="card"><div class="hero"><div><div class="h1">Testing</div><div class="muted">Track perc, soil, water, well, environmental and inspection work by property.</div></div><button class="btn" onclick="addRecord('tests')">+ Testing Item</button></div></div>${recordRows('tests','Testing')}`}
function permits(){return `<div class="card"><div class="hero"><div><div class="h1">Permits</div><div class="muted">Track permit applications, approvals, expirations and documents.</div></div><button class="btn" onclick="addRecord('permits')">+ Permit</button></div></div>${recordRows('permits','Permits')}`}
function approvals(){let arr=[];db.properties.forEach(p=>(p.approvals||[]).forEach(a=>arr.push({p,a})));return `<div class="card"><div class="h1">Pending Approvals</div><div class="muted">Zoning, Pinelands, health, septic and other approvals awaiting action.</div></div>${arr.length?arr.map(x=>`<div class="card"><h3>${esc(x.p.address)}</h3><b>${esc(x.a.type)}</b> • ${esc(x.a.status)}<p>${esc(x.a.notes||'')}</p></div>`).join(''):'<div class="card empty">No pending approvals.</div>'}`}
function recordRows(key,title){let arr=[];db.properties.forEach((p,pi)=>(p[key]||[]).forEach((r,ri)=>arr.push({p,pi,r,ri})));return arr.length?arr.map(x=>`<div class="card"><div class="hero"><div><h3>${esc(x.p.address)}</h3><b>${esc(x.r.type)}</b> • ${esc(x.r.status)}</div><button class="btn danger" onclick="db.properties[${x.pi}].${key}.splice(${x.ri},1);save();render()">Delete</button></div><p>${esc(x.r.notes||'')}</p><div class="small muted">${esc(x.r.date||'')} ${x.r.contact?'• '+esc(x.r.contact):''}</div></div>`).join(''):'<div class="card empty">Nothing recorded yet.</div>'}
function profile(){let p=db.profile;return `<div class="card"><div class="h1">Profile & Account</div><div class="grid2"><div class="field"><label>First name</label><input id="pf" value="${esc(p.first)}"></div><div class="field"><label>Last name</label><input id="pl" value="${esc(p.last)}"></div><div class="field"><label>Username</label><input id="pu" value="${esc(p.username)}"></div><div class="field"><label>Email</label><input id="pe" value="${esc(p.email)}"></div><div class="field"><label>Phone number</label><input id="pp" value="${esc(p.phone)}"></div><div class="field"><label>Profile type</label><select id="pt">${['Investor','Land Holder','Homesteader','Private Owner','Researcher','Developer','Undecided'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div></div><button class="btn" style="margin-top:12px" onclick="saveProfile()">Save Profile</button><p class="small muted">This free prototype stores profile data locally on this device. Real account/password authentication requires a secure backend.</p></div>`}
function saveProfile(){db.profile={first:pf.value,last:pl.value,username:pu.value,email:pe.value,phone:pp.value,type:pt.value};save();render()}
function openProperty(){modal.innerHTML=`<div class="modalwrap"><div class="modalbox"><div class="hero"><h2>Add Property</h2><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="grid2"><div class="field"><label>Address</label><input id="pa"></div><div class="field"><label>City</label><input id="pc"></div><div class="field"><label>State</label><input id="ps" value="NJ"></div><div class="field"><label>ZIP</label><input id="pz"></div><div class="field"><label>Block</label><input id="pb"></div><div class="field"><label>Lot</label><input id="pl2"></div><div class="field"><label>Acreage</label><input id="pac"></div><div class="field"><label>Asking price</label><input id="ppc"></div></div><div class="field"><label>Zoning</label><input id="pzoning"></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="addProperty()">Save Property</button><button class="btn secondary" onclick="researchAndSave()">Research & Save</button></div></div></div>`}
function addProperty(){db.properties.push(baseProp({address:pa.value,city:pc.value,state:ps.value,zip:pz.value,block:pb.value,lot:pl2.value,acres:pac.value,price:ppc.value,zoning:pzoning.value}));save();closeModal();go('Saved Properties')}
function researchAndSave(){closeModal();go('Research');setTimeout(()=>{document.getElementById('researchAddr').value=pa.value+', '+pc.value+', '+ps.value+' '+pz.value;researchNJ()},50)}
function baseProp(x){return Object.assign({offers:[],tests:[],permits:[],communications:[],documents:[],photos:[],estimates:[],contracts:[],approvals:[],checks:[]},x)}
function delProp(i){if(confirm('Delete this saved property?')){db.properties.splice(i,1);save();render()}}
function openContact(){modal.innerHTML=`<div class="modalwrap"><div class="modalbox"><div class="hero"><h2>Save Contact</h2><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="grid2"><div class="field"><label>Name</label><input id="cn"></div><div class="field"><label>Company / Organization</label><input id="cc"></div><div class="field"><label>Role / Specialty</label><input id="cr"></div><div class="field"><label>Phone</label><input id="cp"></div><div class="field"><label>Email</label><input id="ce"></div><div class="field"><label>Website</label><input id="cw"></div></div><div class="field"><label>Notes</label><textarea id="cnotes"></textarea></div><button class="btn" onclick="addContact()">Save Contact</button></div></div>`}
function addContact(){db.contacts.push({name:cn.value,company:cc.value,role:cr.value,phone:cp.value,email:ce.value,website:cw.value,notes:cnotes.value,comms:[]});save();closeModal();render()}
function logComm(i){let c=db.contacts[i];modal.innerHTML=`<div class="modalwrap"><div class="modalbox"><h2>Log Communication</h2><div class="grid2"><div class="field"><label>Date</label><input id="md" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Type</label><select id="mt"><option>Call</option><option>Email</option><option>Text</option><option>Meeting</option><option>Letter</option><option>Other</option></select></div></div><div class="field"><label>Subject</label><input id="ms"></div><div class="field"><label>Notes / response</label><textarea id="mn"></textarea></div><button class="btn" onclick="db.contacts[${i}].comms=(db.contacts[${i}].comms||[]);db.contacts[${i}].comms.push({date:md.value,type:mt.value,subject:ms.value,notes:mn.value});save();closeModal();render()">Save Communication</button> <button class="btn secondary" onclick="closeModal()">Cancel</button></div></div>`}
function addRecord(key){if(!db.properties.length){alert('Add a property first.');return}modal.innerHTML=`<div class="modalwrap"><div class="modalbox"><h2>${key==='tests'?'Add Testing Item':'Add Permit'}</h2><div class="field"><label>Property</label><select id="rp">${db.properties.map((p,i)=>`<option value="${i}">${esc(p.address)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Type</label><select id="rt">${(key==='tests'?TEST_TYPES:PERMIT_TYPES).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="rs"><option>Pending</option><option>Scheduled</option><option>Submitted</option><option>Approved</option><option>Pending Approval</option><option>Completed</option></select></div><div class="field"><label>Date</label><input id="rd" type="date"></div><div class="field"><label>Contact</label><input id="rc"></div></div><div class="field"><label>Notes</label><textarea id="rn"></textarea></div><button class="btn" onclick="db.properties[+rp.value][${key}].push({type:rt.value,status:rs.value,date:rd.value,contact:rc.value,notes:rn.value});save();closeModal();render()">Save</button></div></div>`}
function openWorkspace(i){selected=i;workspaceTab='Overview';renderWorkspace()}
function renderWorkspace(){let p=db.properties[selected];modal.innerHTML=`<div class="modalwrap"><div class="modalbox"><div class="hero"><div><h2>${esc(p.address)}</h2><div class="muted">Property Workspace</div></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="tabs">${['Overview','Research','Due Diligence','Contacts','Testing','Permits','Documents','Offers','Contracts','Photos','Estimates'].map(x=>`<button class="${workspaceTab===x?'active':''}" onclick="workspaceTab='${x}';renderWorkspace()">${x}</button>`).join('')}</div>${workspaceContent(p)}</div></div>`}
function workspaceContent(p){if(workspaceTab==='Overview')return `<div class="grid4"><div class="stat"><b>${esc(p.block||'—')}</b>Block</div><div class="stat"><b>${esc(p.lot||'—')}</b>Lot</div><div class="stat"><b>${esc(p.acres||'—')}</b>Acres</div><div class="stat"><b>${esc(p.zoning||'—')}</b>Zoning</div></div><div class="grid2" style="margin-top:12px"><div><h3>Property Records</h3><p>PIN: <b>${esc(p.pin||'—')}</b><br>County: ${esc(p.county||'—')}<br>Municipality: ${esc(p.municipality||'—')}<br>Taxes: ${money(p.tax)}<br>Assessed: ${money(p.netVal)}</p></div><div><h3>Next Actions</h3>${CHECKS.slice(0,6).map((x,j)=>`<label class="check"><input type="checkbox" ${p.checks?.[j]?'checked':''} onchange="toggleCheck(${selected},${j},this.checked)">${x}</label>`).join('')}</div></div>`;if(workspaceTab==='Research')return `<h3>Public Research</h3><table class="table">${[['Address',p.address],['Block',p.block],['Lot',p.lot],['Qualifier',p.qualifier],['PIN',p.pin],['County',p.county],['Municipality',p.municipality],['Acreage',p.acres],['Property class',p.propClass],['Land value',money(p.landVal)],['Improvement value',money(p.imprVal)],['Net assessed',money(p.netVal)],['Prior-year tax',money(p.tax)],['Building',p.bldgDesc],['Land',p.landDesc]].map(r=>`<tr><th>${esc(r[0])}</th><td>${esc(r[1]??'—')}</td></tr>`).join('')}</table>`;if(workspaceTab==='Due Diligence')return `<h3>Due-Diligence Checklist</h3>${CHECKS.map((x,j)=>`<label class="check"><input type="checkbox" ${p.checks?.[j]?'checked':''} onchange="toggleCheck(${selected},${j},this.checked)">${x}</label>`).join('')}`;if(workspaceTab==='Contacts')return `<h3>Property Contacts</h3><button class="btn" onclick="closeModal();openContact()">+ Save Contact</button><p class="muted">Use Saved Contacts for reusable contacts and log correspondence.</p>`;if(workspaceTab==='Testing')return `<h3>Testing</h3>${(p.tests||[]).map(x=>`<div class="item"><b>${esc(x.type)}</b> • ${esc(x.status)}<br>${esc(x.notes||'')}</div>`).join('')||'<p class="muted">No testing items.</p>'}`;if(workspaceTab==='Permits')return `<h3>Permits & Approvals</h3>${(p.permits||[]).map(x=>`<div class="item"><b>${esc(x.type)}</b> • ${esc(x.status)}<br>${esc(x.notes||'')}</div>`).join('')||'<p class="muted">No permits.</p>'}`;if(workspaceTab==='Offers')return `<h3>Offers</h3>${(p.offers||[]).map(x=>`<div class="item"><b>$${esc(x.amount||'—')}</b> • ${esc(x.status)}<br>${esc(x.notes||'')}</div>`).join('')||'<p class="muted">No offers.</p>'}`;if(workspaceTab==='Contracts')return fileArea('Contracts',p.contracts);if(workspaceTab==='Documents')return fileArea('Documents',p.documents);if(workspaceTab==='Photos')return fileArea('Photos',p.photos);if(workspaceTab==='Estimates')return `<h3>Work Estimates</h3>${(p.estimates||[]).map(x=>`<div class="item"><b>${esc(x.trade||'Work')}</b> — ${money(x.amount)}<br>${esc(x.contractor||'')}<br>${esc(x.notes||'')}</div>`).join('')||'<p class="muted">No estimates recorded.</p>'}`}
function fileArea(title,arr){return `<h3>${title}</h3><p class="muted">The workspace is ready for ${title.toLowerCase()} records. In this free build, use notes/records first; cloud file storage will be connected in the backend version.</p>${(arr||[]).map(x=>`<div class="item"><b>${esc(x.name||'Record')}</b><br>${esc(x.notes||'')}</div>`).join('')}`}
function toggleCheck(pi,j,v){db.properties[pi].checks=db.properties[pi].checks||[];db.properties[pi].checks[j]=v;save()}
function closeModal(){modal.innerHTML=''}
render();
</script></body></html>
