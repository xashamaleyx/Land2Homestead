<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Land2Homestead</title>
<style>
:root{--bg:#f5f7f4;--card:#fff;--ink:#17301f;--muted:#68756b;--line:#dfe6df;--accent:#2d6a45;--accent2:#e8f1ea;--warn:#8a641d;--danger:#a33b36}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#17301f;color:white;padding:18px 20px;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:22px}.wrap{max-width:1180px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:240px 1fr;gap:18px}.nav,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.nav{padding:10px;height:max-content;position:sticky;top:78px}.nav button{display:block;width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:9px;color:var(--ink)}.nav button.active,.nav button:hover{background:var(--accent2);color:var(--accent)}.card{padding:18px;margin-bottom:16px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center}.h1{font-size:30px;font-weight:800;margin:0 0 5px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.stat{background:var(--accent2);border-radius:12px;padding:14px}.stat b{display:block;font-size:22px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}.btn.secondary{background:#eef2ee;color:var(--ink)}.btn.danger{background:#fff0ef;color:var(--danger)}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.field textarea{min-height:90px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2ee;font-size:12px;margin:2px}.green{color:var(--accent)}.yellow{color:var(--warn)}.red{color:var(--danger)}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.property{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.property h3{margin:0 0 4px}.small{font-size:12px}.hidden{display:none}.check{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #edf1ed}.check input{margin-top:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modalbox{background:white;border-radius:16px;max-width:650px;width:100%;max-height:90vh;overflow:auto;padding:20px}.right{text-align:right}@media(max-width:800px){.grid{grid-template-columns:1fr}.nav{position:static}.stats,.row,.row3,.two{grid-template-columns:1fr}.hero{display:block}.wrap{padding:12px}}
</style></head><body>
<div class="top"><div class="wrap" style="padding:0"><div class="brand">Land2Homestead</div><div style="font-size:12px;opacity:.8">Land research • due diligence • property management</div></div></div>
<div class="wrap"><div class="grid"><aside class="nav" id="nav"></aside><main id="app"></main></div></div><div id="modal"></div>
<script>
const KEY='l2h_v4';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{profile:{first:'',last:'',username:'',email:'',phone:'',type:'Undecided'},properties:[],contacts:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(db))} function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const navItems=['Dashboard','Saved Properties','Contacts','Pending Offers','Research','Testing','Permits','Pending Approvals','Profile']; let page='Dashboard', selected=null;
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('')}
function go(x){page=x;renderNav();render()}
function render(){renderNav();let a=document.getElementById('app');if(page==='Dashboard')a.innerHTML=dashboard();if(page==='Saved Properties')a.innerHTML=properties();if(page==='Contacts')a.innerHTML=contacts();if(page==='Pending Offers')a.innerHTML=offers();if(page==='Research')a.innerHTML=research();if(page==='Testing')a.innerHTML=testing();if(page==='Permits')a.innerHTML=permits();if(page==='Pending Approvals')a.innerHTML=approvals();if(page==='Profile')a.innerHTML=profile()}
function dashboard(){let p=db.properties;let offers=p.reduce((n,x)=>n+(x.offers||[]).filter(o=>['Pending','Submitted','Countered'].includes(o.status)).length,0),tests=p.reduce((n,x)=>n+(x.tests||[]).filter(t=>t.status==='Pending').length,0),perms=p.reduce((n,x)=>n+(x.permits||[]).filter(t=>t.status==='Pending').length,0);return `<div class="card"><div class="hero"><div><div class="h1">Property Command Center</div><div class="muted">Research, due diligence, contacts, offers, permits and project records.</div></div><button class="btn" onclick="openProp()">+ Add Property</button></div><div class="stats"><div class="stat"><b>${p.length}</b>Saved Properties</div><div class="stat"><b>${db.contacts.length}</b>Contacts</div><div class="stat"><b>${offers}</b>Pending Offers</div><div class="stat"><b>${tests+perms}</b>Pending Actions</div></div></div><div class="two"><div class="card"><h2>Action Center</h2>${p.length?`<div class="item">🟡 ${tests} testing item(s) pending</div><div class="item">🟡 ${perms} permit item(s) pending</div><div class="item">🟡 ${offers} offer(s) awaiting action</div>`:`<p class="muted">Add your first property to start.</p>`}</div><div class="card"><h2>Quick Access</h2><div class="toolbar"><button class="btn secondary" onclick="go('Research')">Research</button><button class="btn secondary" onclick="go('Contacts')">Contacts</button><button class="btn secondary" onclick="go('Testing')">Testing</button><button class="btn secondary" onclick="go('Permits')">Permits</button></div></div></div>`}
function properties(){return `<div class="card"><div class="hero"><div><div class="h1">Saved Properties</div><div class="muted">Every property gets its own due-diligence workspace.</div></div><button class="btn" onclick="openProp()">+ Add Property</button></div></div>${db.properties.length?db.properties.map((p,i)=>`<div class="card property"><div><h3>${esc(p.address||'Unnamed property')}</h3><div class="muted">${esc(p.city||'')} ${esc(p.state||'NJ')} ${esc(p.zip||'')}</div><div><span class="pill">Block ${esc(p.block||'—')}</span><span class="pill">Lot ${esc(p.lot||'—')}</span><span class="pill">${esc(p.acres||'—')} acres</span><span class="pill">${esc(p.zoning||'Zoning unknown')}</span></div></div><div class="toolbar"><button class="btn" onclick="openWorkspace(${i})">Open</button><button class="btn danger" onclick="delProp(${i})">Delete</button></div></div>`).join(''):`<div class="card"><p class="muted">No saved properties yet.</p></div>`}`}
function contacts(){return `<div class="card"><div class="hero"><div><div class="h1">Saved Contacts</div><div class="muted">People and organizations reusable across properties.</div></div><button class="btn" onclick="openContact()">+ Contact</button></div></div>${db.contacts.length?db.contacts.map((c,i)=>`<div class="card"><h3>${esc(c.name)}</h3><div class="muted">${esc(c.role||'')} • ${esc(c.company||'')}</div><p>${c.email?`✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:''} ${c.phone?` &nbsp; 📞 <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:''}</p><div class="toolbar"><button class="btn secondary" onclick="logComm(${i})">Log Communication</button><button class="btn danger" onclick="db.contacts.splice(${i},1);save();render()">Delete</button></div></div>`).join(''):`<div class="card"><p class="muted">No contacts yet.</p></div>`}`}
function offers(){let arr=[];db.properties.forEach((p,pi)=>(p.offers||[]).forEach((o,oi)=>arr.push({p,pi,o,oi})));return `<div class="card"><div class="h1">Pending Offers</div><div class="muted">Offers and counteroffers across saved properties.</div></div>${arr.length?arr.map(x=>`<div class="card"><h3>${esc(x.p.address)}</h3><div><b>$${esc(x.o.amount||'—')}</b> • ${esc(x.o.status)} • ${esc(x.o.date||'')}</div><p>${esc(x.o.notes||'')}</p></div>`).join(''):`<div class="card"><p class="muted">No offers recorded.</p></div>`}
function research(){return `<div class="card"><div class="h1">Research</div><div class="muted">Enter a New Jersey property to query public parcel information.</div><div class="toolbar"><input id="researchAddr" placeholder="Property address" style="flex:1;min-width:220px;padding:10px;border:1px solid var(--line);border-radius:9px"><button class="btn" onclick="researchNJ()">Research Property</button></div><div id="researchResult"></div></div><div class="card"><h2>Research sources</h2><p class="muted">NJ statewide parcel/MOD-IV data, public tax/deed fields and public GIS layers can be used. MLS/listing information must come from an authorized feed or user-provided listing source.</p></div>`}
async function researchNJ(){let addr=document.getElementById('researchAddr').value.trim(), out=document.getElementById('researchResult');if(!addr)return;out.innerHTML='<p>Researching…</p>';try{let u='https://geo.nj.gov/arcgis/rest/services/Tasks/NJ_Geocode/GeocodeServer/findAddressCandidates?SingleLine='+encodeURIComponent(addr+', NJ')+'&f=json&outSR=4326';let g=await fetch(u).then(r=>r.json());let c=g.candidates?.[0];if(!c){out.innerHTML='<p class="red">No NJ address match found.</p>';return}let a=c.address, [lon,lat]=c.location? [c.location.x,c.location.y]:[null,null];out.innerHTML=`<div class="card" style="margin-top:12px"><h3>Matched address</h3><p>${esc(a)}</p><p class="muted">Coordinates: ${lat?.toFixed(6)}, ${lon?.toFixed(6)}</p><button class="btn" onclick="saveResearch('${esc(a).replace(/'/g,"\\'")}')">Save as Property</button></div>`}catch(e){out.innerHTML='<p class="red">Research service could not be reached. Try again.</p>'}}
function saveResearch(a){db.properties.push({address:a,state:'NJ',acres:'',block:'',lot:'',zoning:'',offers:[],tests:[],permits:[],communications:[],documents:[],contacts:[],photos:[],estimates:[],research:{}});save();go('Saved Properties')}
function testing(){return `<div class="card"><div class="h1">Testing</div><div class="muted">Perc, soil, water, well, environmental and inspection testing.</div></div>${allRows('tests','Testing')}`}
function permits(){return `<div class="card"><div class="h1">Permits</div><div class="muted">Building, zoning, septic, well, driveway, clearing, environmental and Pinelands permits.</div></div>${allRows('permits','Permits')}`}
function approvals(){return `<div class="card"><div class="h1">Pending Approvals</div><div class="muted">Track zoning boards, planning boards, health department, Pinelands and other approvals.</div></div>${allRows('approvals','Pending Approvals')}`}
function allRows(kind,title){let rows=[];db.properties.forEach((p,pi)=>{let source=kind==='approvals'?(p.approvals||[]):(p[kind]||[]);source.forEach((x,xi)=>rows.push({p,pi,x,xi}))});return rows.length?`<div>${rows.map(r=>`<div class="card"><h3>${esc(r.p.address)}</h3><div><b>${esc(r.x.type||r.x.name||title)}</b> • <span class="${r.x.status==='Pending'?'yellow':'green'}">${esc(r.x.status||'Pending')}</span></div><p>${esc(r.x.notes||'')}</p></div>`).join('')}</div>`:`<div class="card"><p class="muted">Nothing recorded yet.</p></div>`}
function profile(){let p=db.profile;return `<div class="card"><div class="h1">Profile</div><div class="row"><div class="field"><label>First name</label><input id="pf" value="${esc(p.first)}"></div><div class="field"><label>Last name</label><input id="pl" value="${esc(p.last)}"></div><div class="field"><label>Username</label><input id="pu" value="${esc(p.username)}"></div><div class="field"><label>Email</label><input id="pe" type="email" value="${esc(p.email)}"></div><div class="field"><label>Phone number</label><input id="pp" value="${esc(p.phone)}"></div><div class="field"><label>Profile type</label><select id="pt">${['Investor','Land Holder','Homesteader','Private Owner','Researcher','Developer','Undecided'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="toolbar"><button class="btn" onclick="saveProfile()">Save Profile</button></div><p class="muted small">Password authentication will require a secure backend; this free prototype does not store passwords.</p></div>`}
function saveProfile(){Object.assign(db.profile,{first:pf.value,last:pl.value,username:pu.value,email:pe.value,phone:pp.value,type:pt.value});save();render()}
function openProp(){modal.innerHTML=`<div class="modal"><div class="modalbox"><div class="hero"><h2>Add Property</h2><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="row"><div class="field"><label>Address</label><input id="pa"></div><div class="field"><label>City</label><input id="pc"></div><div class="field"><label>ZIP</label><input id="pz"></div><div class="field"><label>Acres</label><input id="pac"></div><div class="field"><label>Block</label><input id="pbl"></div><div class="field"><label>Lot</label><input id="plo"></div><div class="field"><label>Zoning</label><input id="pzo"></div><div class="field"><label>Asking price</label><input id="ppr"></div></div><div class="toolbar"><button class="btn" onclick="addProp()">Save Property</button></div></div></div>`}
function addProp(){db.properties.push({address:pa.value,city:pc.value,state:'NJ',zip:pz.value,acres:pac.value,block:pbl.value,lot:plo.value,zoning:pzo.value,price:ppr.value,offers:[],tests:[],permits:[],approvals:[],communications:[],documents:[],contacts:[],photos:[],estimates:[],research:{}});save();closeModal();render()}
function openContact(){modal.innerHTML=`<div class="modal"><div class="modalbox"><div class="hero"><h2>Saved Contact</h2><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="row"><div class="field"><label>Name</label><input id="cn"></div><div class="field"><label>Company / Organization</label><input id="cc"></div><div class="field"><label>Role / Specialty</label><input id="cr"></div><div class="field"><label>Phone</label><input id="cp"></div><div class="field"><label>Email</label><input id="ce"></div><div class="field"><label>Website</label><input id="cw"></div></div><div class="toolbar"><button class="btn" onclick="addContact()">Save Contact</button></div></div></div>`}
function addContact(){db.contacts.push({name:cn.value,company:cc.value,role:cr.value,phone:cp.value,email:ce.value,website:cw.value,communications:[]});save();closeModal();render()}
function logComm(i){let c=db.contacts[i];modal.innerHTML=`<div class="modal"><div class="modalbox"><h2>Log Communication — ${esc(c.name)}</h2><div class="row"><div class="field"><label>Type</label><select id="ct"><option>Call</option><option>Email</option><option>Text</option><option>Meeting</option><option>Letter</option><option>Other</option></select></div><div class="field"><label>Date</label><input id="cd" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>Subject / Notes</label><textarea id="cm"></textarea></div><div class="toolbar"><button class="btn" onclick="c.communications=c.communications||[];c.communications.push({type:ct.value,date:cd.value,notes:cm.value});save();closeModal();render()">Save</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div></div></div>`}
function openWorkspace(i){let p=db.properties[i];selected=i;modal.innerHTML=`<div class="modal"><div class="modalbox"><div class="hero"><div><h2>${esc(p.address)}</h2><div class="muted">Property Workspace</div></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="toolbar"><button class="btn secondary" onclick="alert('Research engine: use Research tab for live NJ public-data lookup.')">Public Research</button><button class="btn secondary" onclick="alert('Use Saved Contacts to manage reusable contacts and communication records.')">Contacts</button></div><div class="two"><div><h3>Due Diligence Checklist</h3>${['Verify address','Verify block & lot','Review deed','Review taxes','Review zoning','Check Pinelands','Check wetlands','Check flood zone','Check septic/perc','Check well/water','Check utilities','Contact zoning office','Obtain survey','Review permits','Request contractor estimates','Review listing/MLS','Prepare offer'].map((x,j)=>`<label class="check"><input type="checkbox" onchange="toggleCheck(${i},${j},this.checked)" ${p.checks?.[j]?'checked':''}>${x}</label>`).join('')}</div><div><h3>Property Records</h3><p><span class="pill">Block ${esc(p.block||'—')}</span><span class="pill">Lot ${esc(p.lot||'—')}</span></p><p>Acres: <b>${esc(p.acres||'—')}</b></p><p>Zoning: <b>${esc(p.zoning||'Unknown')}</b></p><p>Asking price: <b>${p.price?'$'+esc(p.price):'—'}</b></p><h3>Workspace</h3><p class="muted">Blueprints, photos, contractors, estimates, deed records, contracts, permits, offers, correspondence and documents are designed to live here.</p></div></div></div></div>`}
function toggleCheck(pi,j,v){db.properties[pi].checks=db.properties[pi].checks||[];db.properties[pi].checks[j]=v;save()}
function closeModal(){modal.innerHTML=''} function delProp(i){if(confirm('Delete this saved property?')){db.properties.splice(i,1);save();render()}}
render();
</script></body></html>
